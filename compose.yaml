services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wondr_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_NAME: WONDR
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-wondr}
      DB_USERNAME: ${DB_USERNAME:-wondr}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
    volumes:
      - ./:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - wondr_network

  web:
    image: nginx:alpine
    container_name: wondr_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - wondr_network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wondr_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - wondr_network

  postgres:
    image: postgres:16-alpine
    container_name: wondr_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wondr}
      POSTGRES_USER: ${DB_USERNAME:-wondr}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - wondr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wondr} -d ${DB_DATABASE:-wondr}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wondr_network

  redis:
    image: redis:alpine
    container_name: wondr_redis
    restart: unless-stopped
    volumes:
      - wondr_redisdata:/data
    networks:
      - wondr_network

volumes:
  wondr_pgdata:
  wondr_redisdata:

networks:
  wondr_network:
    driver: bridge
